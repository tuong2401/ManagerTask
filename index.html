<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trung tâm điều phối công việc</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-2: #f6f8fa;
    --panel-3: #fbfcfd;
    --border: #d7dde3;
    --border-strong: #bcc5cd;
    --text: #1c2530;
    --text-dim: #5c6b78;
    --text-faint: #93a1ab;

    --blue: #2b6ca3;   --blue-soft: #e4eef7;
    --amber: #b9791f;  --amber-soft: #faf1de;
    --teal: #1f7f77;   --teal-soft: #e2f2f0;
    --green: #2f7d4f;  --green-soft: #e3f3e8;
    --red: #b8392a;    --red-soft: #fbe9e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  #app { max-width: 1280px; margin: 0 auto; padding: 26px 20px 60px; }

  button {
    font-family: inherit; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
    border-radius: 6px; transition: border-color .15s ease, background .15s ease;
  }
  button:hover { border-color: var(--text-dim); background: var(--panel-2); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 1px;
  }
  input, select, textarea {
    font-family: inherit; background: var(--panel); border: 1px solid var(--border-strong);
    color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }

  /* ---- header ---- */
  .header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; border-bottom: 2px solid var(--border-strong); padding-bottom: 18px; margin-bottom: 8px; }
  .title-row { display: flex; align-items: center; gap: 9px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--green); border: 2px solid var(--green-soft); }
  @media (prefers-reduced-motion: no-preference) { .led { animation: pulse 2.4s ease-in-out infinite; } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .title { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 21px; letter-spacing: .01em; }
  .subtitle { color: var(--text-dim); font-size: 12.5px; margin-top: 4px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; min-width: 92px; }
  .stat-label { font-size: 10px; letter-spacing: .07em; color: var(--text-faint); text-transform: uppercase; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; margin-top: 2px; }
  .stat-value.warn { color: var(--red); }

  .sync-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 11.5px; color: var(--text-faint); padding: 8px 2px 18px; }
  .sync-bar .shared-note { display: flex; align-items: center; gap: 5px; }
  .sync-error { color: var(--red); }
  .demo-banner { background: var(--amber-soft); border: 1px solid var(--amber); color: var(--amber); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  /* ---- layout ---- */
  .layout { display: grid; grid-template-columns: 230px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel-head { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .07em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }

  .emp-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
  .emp-row:hover { background: var(--panel-2); }
  .emp-row.active { background: var(--blue-soft); border-color: var(--blue); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .emp-info { flex: 1; min-width: 0; }
  .emp-name { font-size: 13px; font-weight: 500; }
  .emp-role { font-size: 11px; color: var(--text-faint); }
  .emp-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; }

  .small-btn { width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-size: 12px; }
  .reset-link { width: 100%; margin-top: 6px; text-align: center; font-size: 11px; color: var(--text-faint); background: none; border: none; text-decoration: underline; padding: 4px; }

  .form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); display: flex; flex-direction: column; gap: 8px; }
  .form-actions { display: flex; gap: 8px; }
  .form-actions button { flex: 1; padding: 7px; font-size: 12px; }
  .btn-primary { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; }
  .btn-primary:hover { background: #23578a !important; }
  .form-error { color: var(--red); font-size: 11.5px; }

  /* ---- toolbar ---- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar-actions { display: flex; gap: 8px; }
  .add-task-btn, .export-btn { display: flex; align-items: center; gap: 6px; padding: 9px 14px; font-size: 13px; font-weight: 500; }
  .add-task-btn { background: var(--blue); border-color: var(--blue); color: #fff; }
  .add-task-btn:hover { background: #23578a; }
  .export-btn { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-soft); border: 1px solid var(--blue); color: var(--blue); border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer; }

  /* ---- view tabs ---- */
  .view-tabs { display: flex; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .view-tab { display: flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 12.5px; font-weight: 500; color: var(--text-dim); border: none; background: transparent; border-radius: 6px; }
  .view-tab:hover { background: var(--panel); border: none; }
  .view-tab.active { background: var(--blue); color: #fff; }
  .view-tab.active:hover { background: var(--blue); }

  /* ---- dashboard ---- */
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .dash-card-head { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
  .donut-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 150px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .legend-item .dot { width: 9px; height: 9px; flex-shrink: 0; }
  .legend-item .legend-label { flex: 1; color: var(--text-dim); }
  .legend-item .legend-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  .emp-bar-row { margin-bottom: 13px; }
  .emp-bar-row:last-child { margin-bottom: 0; }
  .emp-bar-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; gap: 8px; }
  .emp-bar-name { display: flex; align-items: center; gap: 6px; font-weight: 500; min-width: 0; }
  .emp-bar-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emp-bar-count { font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); font-size: 11px; white-space: nowrap; }
  .bar-track { height: 9px; background: var(--panel-2); border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
  .bar-fill { height: 100%; position: relative; border-radius: 6px; }
  .bar-fill-done { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 6px; }

  .alert-list, .recent-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .alert-item, .recent-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; font-size: 12.5px; }
  .alert-item { background: var(--red-soft); }
  .alert-item svg { color: var(--red); flex-shrink: 0; }
  .recent-item { background: var(--green-soft); }
  .recent-item svg { color: var(--green); flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .item-date { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; white-space: nowrap; }
  .empty-dash { color: var(--text-faint); font-size: 12.5px; padding: 10px 2px; }

  /* ---- task form (2 hàng) ---- */
  .task-form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .task-form-row { display: grid; grid-template-columns: 2fr 1.2fr 1fr; gap: 8px; }
  .task-form-row2 { display: grid; grid-template-columns: 1fr 1fr 1fr 2fr; gap: 8px; align-items: end; }
  @media (max-width: 760px) { .task-form-row, .task-form-row2 { grid-template-columns: 1fr 1fr; } }
  .field-label { font-size: 10px; color: var(--text-faint); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: .05em; }
  .task-form textarea { width: 100%; resize: vertical; min-height: 36px; }

  /* ---- table ---- */
  .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  table.tasks { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  table.tasks th {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-dim); text-align: left; padding: 10px 14px 10px 12px; border-bottom: 2px solid var(--border-strong);
    background: var(--panel-2); white-space: nowrap; position: sticky; top: 0; position: relative;
    overflow: hidden; text-overflow: ellipsis;
  }
  table.tasks td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-word; overflow: hidden; }
  table.tasks tbody tr:nth-child(odd) { background: var(--panel-3); }
  table.tasks tbody tr:hover { background: var(--blue-soft); }
  .col-title { font-weight: 500; }
  .col-assignee { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-date { white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .col-date.overdue { color: var(--red); font-weight: 600; }

  .col-resizer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3;
  }
  .col-resizer:hover, .col-resizer.active { background: var(--blue); opacity: .5; }
  .row-resizer {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; cursor: row-resize; color: var(--text-faint); border-radius: 4px; flex-shrink: 0;
  }
  .row-resizer:hover { background: var(--panel-2); color: var(--blue); }
  .actions-cell { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .03em; padding: 2px 7px; border-radius: 4px; border: 1px solid; text-transform: uppercase; white-space: nowrap; display: inline-block; }
  .assignee-cell { display: flex; align-items: center; gap: 6px; }
  select.status-select { font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 7px; border-radius: 5px; font-weight: 600; }
  .icon-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .icon-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
  .empty-table { padding: 30px; text-align: center; color: var(--text-faint); font-size: 13px; }
  input.date-edit, textarea.notes-edit {
    border: 1px solid transparent; background: transparent; padding: 4px 6px; font-size: 12px; width: 100%;
    border-radius: 4px; color: var(--text); font-family: inherit;
  }
  input.date-edit { font-family: 'IBM Plex Mono', monospace; min-width: 118px; }
  input.date-edit.overdue { color: var(--red); font-weight: 600; }
  textarea.notes-edit {
    resize: both; overflow: auto; min-width: 140px; min-height: 30px; max-width: 480px;
    line-height: 1.4; white-space: pre-wrap;
  }
  input.date-edit:hover, textarea.notes-edit:hover { border-color: var(--border-strong); background: var(--panel-2); }
  input.date-edit:focus, textarea.notes-edit:focus { border-color: var(--blue); background: var(--panel); outline: none; }
  .col-notes { min-width: 160px; color: var(--text-dim); max-width: 320px; }

  svg.ic { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

  check: '<polyline points="20 6 9 17 4 12"/>',

function ic(name) { return '<svg class="ic" viewBox="0 0 24 24">' + ICONS[name] + '</svg>'; }

/* ===================== DATA ===================== */
const PALETTE = ["blue", "teal", "green", "amber", "red"];

// Kich thuoc cot/hang do nguoi dung keo gian - luu lai qua cac lan render()
// vi render() ve lai toan bo bang tu dau (innerHTML), khong tu giu state DOM.
const COL_LABELS = ["Công việc","Người phụ trách","Ưu tiên","Trạng thái","Ngày giao","Ngày bắt đầu","Ngày kết thúc","Ghi chú",""];
let colWidths = [220, 150, 100, 150, 115, 125, 125, 220, 90];
let rowHeights = {}; // taskId -> px

function startColResize(e, idx) {
  e.preventDefault();
  const table = document.querySelector("table.tasks");
  const startX = e.clientX;
  const startWidth = colWidths[idx];
  const col = table.querySelectorAll("colgroup col")[idx];
  document.body.style.userSelect = "none";
  function onMove(ev) {
    const w = Math.max(50, startWidth + (ev.clientX - startX));
    col.style.width = w + "px";
  }
  function onUp(ev) {
    const w = Math.max(50, startWidth + (ev.clientX - startX));
    colWidths[idx] = w;
    document.body.style.userSelect = "";
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

function startRowResize(e, grip) {
  e.preventDefault();
  e.stopPropagation();
  const tr = grip.closest("tr");
  const taskId = tr.getAttribute("data-task-id");
  const startY = e.clientY;
  const startHeight = tr.offsetHeight;
  document.body.style.userSelect = "none";
  function onMove(ev) {
    const h = Math.max(30, startHeight + (ev.clientY - startY));
    tr.style.height = h + "px";
  }
  function onUp(ev) {
    const h = Math.max(30, startHeight + (ev.clientY - startY));
    if (taskId) rowHeights[taskId] = h;
    document.body.style.userSelect = "";
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}
let syncing = false;
let syncError = "";
let lastSync = null;

function uid(prefix) { return prefix + Math.random().toString(36).slice(2, 9); }
function isOverdue(endDate, status) {
  if (!endDate || status === "done") return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(endDate + "T00:00:00") < today;
}
function fmtDate(d) {
  if (!d) return "—";
  return new Date(d + "T00:00:00").toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function fmtTime(d) {
  if (!d) return "";
  return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function employeeById(id) { return employees.find((e) => e.id === id); }
function taskCountFor(empId) { return tasks.filter((t) => t.assigneeId === empId).length; }
function statusInfo(key) { return STATUS_OPTS.find((s) => s.key === key) || STATUS_OPTS[0]; }

/* ===================== STORAGE (Firebase Firestore) ===================== */
function initStorage() {
  if (!IS_CONFIGURED) {
    employees = seedEmployees.slice();
    tasks = seedTasks.slice();
    loaded = true;
    render();
    return;
  }
  const docRef = db.collection("tcc").doc("data");
  docRef.onSnapshot(
    (snap) => {
      if (snap.exists) {
        const data = snap.data();
        employees = data.employees || [];
        tasks = data.tasks || [];
      } else {
        employees = seedEmployees.slice();
        tasks = seedTasks.slice();
        // Only seed on the first visit. Later changes use a transaction.
        db.runTransaction((transaction) => transaction.get(docRef).then((current) => {
          if (!current.exists) transaction.set(docRef, { employees, tasks });
        })).catch(() => {});
      }
      loaded = true; syncing = false; syncError = ""; lastSync = new Date();
      render();
    },
    (err) => {
      syncError = err.code === "permission-denied"
        ? "Không có quyền truy cập Firestore - kiểm tra lại Security Rules."
        : "Mất kết nối tới Firestore.";
      loaded = true; syncing = false; render();
    }
  );
}

async function saveData(change) {
  if (!IS_CONFIGURED) return;
  syncing = true; syncError = "";
  renderSyncBar();
  try {
    const docRef = db.collection("tcc").doc("data");
    await db.runTransaction(async (transaction) => {
      const snap = await transaction.get(docRef);
      const serverData = snap.exists ? snap.data() : {};
      const shared = {
        employees: Array.isArray(serverData.employees) ? serverData.employees : [],
        tasks: Array.isArray(serverData.tasks) ? serverData.tasks : [],
      };
      // Firestore retries this if another user saves concurrently.
      change(shared);
      transaction.set(docRef, shared);
    });
    lastSync = new Date();
  } catch (e) {
    syncError = e.code === "permission-denied"
      ? "Không có quyền ghi dữ liệu - kiểm tra lại Security Rules."
      : "Lưu dữ liệu thất bại, vui lòng thử lại.";
  }
  syncing = false;
  renderSyncBar();
}

async function addTask() {
  const title = document.getElementById("f-title").value.trim();
  const assignee = document.getElementById("f-assignee").value;
  const priority = document.getElementById("f-priority").value;
  const assignedDate = document.getElementById("f-assigned").value;
  const startDate = document.getElementById("f-start").value;
  const endDate = document.getElementById("f-end").value;
  const notes = document.getElementById("f-notes").value.trim();
  const errEl = document.getElementById("f-error");
  if (!title || !assignee) {
    if (errEl) errEl.textContent = "Vui lòng nhập tên công việc và chọn người phụ trách.";
    return;
  }
  const task = { id: uid("t"), title, assigneeId: assignee, priority, status: "todo", assignedDate, startDate, endDate, notes };
  if (!IS_CONFIGURED) tasks.push(task);
  showTaskForm = false;
  render();
  await saveData((shared) => shared.tasks.push(task));
}

async function addEmployee() {
  const name = document.getElementById("f-ename").value.trim();
  const role = document.getElementById("f-erole").value.trim();
  const errEl = document.getElementById("f-emp-error");
  if (!name) {
    if (errEl) errEl.textContent = "Vui lòng nhập tên nhân viên.";
    return;
  }
  const employee = { id: uid("e"), name, role: role || "Nhân viên", color: "blue" };
  if (!IS_CONFIGURED) {
    employee.color = PALETTE[employees.length % PALETTE.length];
    employees.push(employee);
  }
  showEmpForm = false;
  render();
  await saveData((shared) => {
    employee.color = PALETTE[shared.employees.length % PALETTE.length];
    shared.employees.push(employee);
  });
}

async function deleteTask(id) {
  if (!IS_CONFIGURED) tasks = tasks.filter((t) => t.id !== id);
  render();
  await saveData((shared) => { shared.tasks = shared.tasks.filter((t) => t.id !== id); });
}

async function setStatus(id, newStatus) {
  if (!IS_CONFIGURED) {
    const t = tasks.find((x) => x.id === id);
    if (!t) return;
    t.status = newStatus;
  }
  render();
  await saveData((shared) => {
    const t = shared.tasks.find((x) => x.id === id);
    if (t) t.status = newStatus;
  });
}

async function updateField(id, field, value) {
  if (!IS_CONFIGURED) {
    const t = tasks.find((x) => x.id === id);
    if (!t) return;
    t[field] = value;
  }
  render();
  await saveData((shared) => {
    const t = shared.tasks.find((x) => x.id === id);
    if (t) t[field] = value;
  });
}

function toggleFilter(id) {
  filterId = filterId === id ? null : id;
  render();
}

async function resetData() {
  if (!confirm("Xoá toàn bộ dữ liệu hiện tại và khôi phục dữ liệu mẫu? Hành động này ảnh hưởng đến tất cả mọi người đang dùng chung.")) return;
  if (!IS_CONFIGURED) {
    employees = seedEmployees.slice();
    tasks = seedTasks.slice();
  }
  render();

function exportExcel() {
  const taskRows = tasks.map((t) => {
    const emp = employeeById(t.assigneeId);
    return {
      "Tên công việc": t.title,
      "Người phụ trách": emp ? emp.name : "Chưa gán",
      "Độ ưu tiên": PRIORITY[t.priority] ? PRIORITY[t.priority].label : t.priority,
      "Trạng thái": statusInfo(t.status).label,
      "Ngày giao": t.assignedDate ? fmtDate(t.assignedDate) : "",
      "Ngày bắt đầu": t.startDate ? fmtDate(t.startDate) : "",
      "Ngày kết thúc": t.endDate ? fmtDate(t.endDate) : "",
      "Quá hạn": isOverdue(t.endDate, t.status) ? "Có" : "Không",
      "Ghi chú": t.notes || "",
    };
  });
  const empRows = employees.map((e) => ({
    "Tên nhân viên": e.name, "Chức vụ": e.role, "Số công việc": taskCountFor(e.id),
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(taskRows), "Công việc");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(empRows), "Nhân sự");
  XLSX.writeFile(wb, "cong-viec-" + new Date().toISOString().slice(0, 10) + ".xlsx");
}

/* ===================== DASHBOARD ===================== */
function buildDonut(segments, opts) {
  opts = opts || {};
  const size = opts.size || 148;
  const thickness = opts.thickness || 20;
  const centerLabel = opts.centerLabel || "";
  const centerSub = opts.centerSub || "";
  const total = segments.reduce((a, s) => a + s.value, 0);
  const radius = (size - thickness) / 2;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  let circles = "";
  if (total <= 0) {
    circles = `<circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="var(--border)" stroke-width="${thickness}"/>`;
  } else {
    segments.forEach((seg) => {
      if (seg.value <= 0) return;
      const frac = seg.value / total;
      const dash = frac * circumference;
      circles += `<circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="var(--${seg.color})" stroke-width="${thickness}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
      offset += dash;
    });
  }
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
      ${circles}
      <text x="50%" y="46%" text-anchor="middle" class="mono" style="font-size:22px;font-weight:700;fill:var(--text)">${escapeHtml(centerLabel)}</text>
      <text x="50%" y="63%" text-anchor="middle" style="font-size:9.5px;fill:var(--text-faint)">${escapeHtml(centerSub)}</text>
    </svg>
  `;
}

function renderDashboard(tasksForDash) {
  const total = tasksForDash.length;
  const todoCount = tasksForDash.filter((t) => t.status === "todo").length;
  const doingCount = tasksForDash.filter((t) => t.status === "doing").length;
  const doneCount = tasksForDash.filter((t) => t.status === "done").length;
  const overdueCount = tasksForDash.filter((t) => isOverdue(t.endDate, t.status)).length;
  const completionRate = total ? Math.round((doneCount / total) * 100) : 0;

  const statusDonut = buildDonut(
    [
      { value: todoCount, color: "amber" },
      { value: doingCount, color: "teal" },
      { value: doneCount, color: "green" },
    ],
    { centerLabel: completionRate + "%", centerSub: "hoàn thành" }
  );

  const empList = filterId ? employees.filter((e) => e.id === filterId) : employees;
  const empCounts = empList.map((e) => tasksForDash.filter((t) => t.assigneeId === e.id).length);
  const maxEmpCount = Math.max(1, ...empCounts, 0);

  const empBars = empList.length
    ? empList.map((e) => {
        const empTasks = tasksForDash.filter((t) => t.assigneeId === e.id);
        const cnt = empTasks.length;
        const done = empTasks.filter((t) => t.status === "done").length;
        const pct = maxEmpCount ? (cnt / maxEmpCount) * 100 : 0;
        const donePct = cnt ? (done / cnt) * 100 : 0;
        return `
          <div class="emp-bar-row">
            <div class="emp-bar-top">
              <span class="emp-bar-name"><span class="dot" style="background:var(--${e.color})"></span><span>${escapeHtml(e.name)}</span></span>
              <span class="emp-bar-count">${done}/${cnt} hoàn thành</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%;background:var(--${e.color}-soft)">
                <div class="bar-fill-done" style="width:${donePct}%;background:var(--${e.color})"></div>
              </div>
            </div>
          </div>
        `;
      }).join("")
    : `<div class="empty-dash">Chưa có nhân sự nào.</div>`;

  const overdueTasks = tasksForDash
    .filter((t) => isOverdue(t.endDate, t.status))
    .slice()
    .sort((a, b) => (a.endDate || "").localeCompare(b.endDate || ""));
  const overdueHtml = overdueTasks.length
    ? overdueTasks.slice(0, 8).map((t) => {
        const emp = employeeById(t.assigneeId);
        return `
          <div class="alert-item">
            ${ic("alert")}
            <div class="item-info">
              <div class="item-title">${escapeHtml(t.title)}</div>
              <div class="item-sub">${emp ? escapeHtml(emp.name) : "Chưa gán"}</div>
            </div>
            <div class="item-date" style="color:var(--red)">${fmtDate(t.endDate)}</div>
          </div>
        `;
      }).join("")
    : `<div class="empty-dash">Không có công việc quá hạn 🎉</div>`;

  const recentDone = tasksForDash
    .filter((t) => t.status === "done")
    .slice()
    .sort((a, b) => (b.endDate || b.assignedDate || "").localeCompare(a.endDate || a.assignedDate || ""));
  const recentHtml = recentDone.length
    ? recentDone.slice(0, 8).map((t) => {
        const emp = employeeById(t.assigneeId);
        return `
          <div class="recent-item">
            ${ic("check")}
            <div class="item-info">
              <div class="item-title">${escapeHtml(t.title)}</div>
              <div class="item-sub">${emp ? escapeHtml(emp.name) : "Chưa gán"}</div>
            </div>
            <div class="item-date" style="color:var(--green)">${fmtDate(t.endDate)}</div>
          </div>
        `;
      }).join("")
    : `<div class="empty-dash">Chưa có công việc nào hoàn thành.</div>`;

  return `
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-card-head">${ic("grid")} Trạng thái công việc</div>
        <div class="donut-row">
          ${statusDonut}
          <div class="donut-legend">
            <div class="legend-item"><span class="dot" style="background:var(--amber)"></span><span class="legend-label">Chờ xử lý</span><span class="legend-value mono">${todoCount}</span></div>
            <div class="legend-item"><span class="dot" style="background:var(--teal)"></span><span class="legend-label">Đang thực hiện</span><span class="legend-value mono">${doingCount}</span></div>
            <div class="legend-item"><span class="dot" style="background:var(--green)"></span><span class="legend-label">Hoàn thành</span><span class="legend-value mono">${doneCount}</span></div>
            <div class="legend-item"><span class="dot" style="background:var(--red)"></span><span class="legend-label">Quá hạn</span><span class="legend-value mono">${overdueCount}</span></div>
          </div>
        </div>
      </div>
      <div class="dash-card">
        <div class="dash-card-head">${ic("users")} Công việc theo nhân viên</div>
        ${empBars}
      </div>
      <div class="dash-card">
        <div class="dash-card-head">${ic("alert")} Cần chú ý (quá hạn)</div>
        <div class="alert-list">${overdueHtml}</div>

        <div class="recent-list">${recentHtml}</div>
      </div>
    </div>
  `;

                    </td>
                    <td class="col-date">${fmtDate(task.assignedDate)}</td>
                    <td class="col-date"><input type="date" class="date-edit" value="${task.startDate || ""}" onchange="updateField('${task.id}','startDate',this.value)" /></td>
                    <td class="col-date ${overdue ? "overdue" : ""}"><input type="date" class="date-edit ${overdue ? "overdue" : ""}" value="${task.endDate || ""}" onchange="updateField('${task.id}','endDate',this.value)" />${overdue ? " ⚠" : ""}</td>
                    <td class="col-notes"><textarea class="notes-edit" rows="1" placeholder="Ghi chú..." title="${escapeAttr(task.notes || "")}" onchange="updateField('${task.id}','notes',this.value)">${escapeHtml(task.notes || "")}</textarea></td>
                    <td><div class="actions-cell">
                      <span class="row-resizer" title="Kéo để chỉnh chiều cao hàng" onmousedown="startRowResize(event,this)">${ic("grip")}</span>
                      <button class="icon-btn danger" onclick="deleteTask('${task.id}')" aria-label="Xoá công việc">${ic("trash")}</button>
                    </div></td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
        `}
      </div>
    </div>
  `;
  renderSyncBar();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s);
}

/* ===================== INIT ===================== */
initStorage();
</script>
</body>
</html>
