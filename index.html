<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Working Tazmo Việt Nam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  /* =====================================================================
     GHI CHU VE FONT CHU (doc truoc khi doi font)
     Day la app 1 file (SPA) nen TAT CA cac trang/view (Dang nhap, Tong
     quan, Dashboard bo phan, Bang cong viec...) dung chung 1 khoi style
     nay -- khong co style rieng cho tung trang.
       - Font chu thuong (noi dung, nhan, mo ta...): IBM Plex Sans
         -> khai bao mac dinh o the body (dong ben duoi), ap dung cho
            toan bo app tru cho nao bi ghi de bang font-family rieng.
       - Font so lieu / mono (so lieu thong ke, ma nhan vien, ngay thang,
         tieu de ky thuat viet hoa...): IBM Plex Mono
         -> duoc set rieng le tai tung class co font-family IBM Plex
            Mono ben duoi, vi du: .title, .stat-value, .dash-summary-value,
            .emp-code, .item-date, .dept-badge, .section-title...
       Muon doi font toan app: sua 2 dong font-family o body va .mono.
       Muon doi font 1 cho cu the: tim dung class do trong CSS, moi cho
       set font-family rieng deu co ghi chu FONT: ... ngay ben canh.
     ===================================================================== */

  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-2: #f6f8fa;
    --panel-3: #fbfcfd;
    --border: #d7dde3;
    --border-strong: #bcc5cd;
    --text: #1c2530;
    --text-dim: #5c6b78;
    --text-faint: #93a1ab;

    --blue: #2b6ca3;   --blue-soft: #e4eef7;
    --amber: #b9791f;  --amber-soft: #faf1de;
    --teal: #1f7f77;   --teal-soft: #e2f2f0;
    --green: #2f7d4f;  --green-soft: #e3f3e8;
    --red: #b8392a;    --red-soft: #fbe9e6;
    --purple: #6a4c93; --purple-soft: #ece5f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); } /* FONT: mặc định toàn app (mọi trang) */
  .mono { font-family: 'IBM Plex Mono', monospace; } /* FONT: class dùng chung cho số liệu, gắn thủ công vào element cần font mono */
  #app { max-width: 1320px; margin: 0 auto; padding: 26px 20px 60px; }

  button {
    font-family: inherit; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
    border-radius: 6px; transition: border-color .15s ease, background .15s ease;
  }
  button:hover { border-color: var(--text-dim); background: var(--panel-2); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 1px;
  }
  input, select, textarea {
    font-family: inherit; background: var(--panel); border: 1px solid var(--border-strong);
    color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }

  /* ---- header ---- */
  .header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; border-bottom: 2px solid var(--border-strong); padding-bottom: 18px; margin-bottom: 8px; }
  .title-row { display: flex; align-items: center; gap: 9px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--green); border: 2px solid var(--green-soft); }
  @media (prefers-reduced-motion: no-preference) { .led { animation: pulse 2.4s ease-in-out infinite; } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .title { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 20px; letter-spacing: .01em; } /* FONT: tiêu đề "TASK WORKING TAZMO..." đầu trang Tổng quan */
  .subtitle { color: var(--text-dim); font-size: 12.5px; margin-top: 4px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; min-width: 88px; }
  .stat-label { font-size: 10px; letter-spacing: .07em; color: var(--text-faint); text-transform: uppercase; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; margin-top: 2px; }
  .stat-value.warn { color: var(--red); }

  .user-chip { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 5px 6px 5px 12px; font-size: 12.5px; }
  .user-chip .who { color: var(--text-dim); }
  .user-chip .who b { color: var(--text); }
  .logout-btn { font-size: 11.5px; padding: 5px 10px; border-radius: 14px; }

  .sync-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 11.5px; color: var(--text-faint); padding: 8px 2px 18px; }
  .sync-bar .shared-note { display: flex; align-items: center; gap: 5px; }
  .sync-error { color: var(--red); }
  .demo-banner { background: var(--amber-soft); border: 1px solid var(--amber); color: var(--amber); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  /* ---- login ---- */
  .login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 30px 28px; box-shadow: 0 10px 30px rgba(28,37,48,.06); }
  .login-title { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 18px; text-align: center; }
  .login-sub { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 4px; margin-bottom: 22px; }
  .login-field { margin-bottom: 12px; }
  .login-field label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 5px; }
  .login-field input { width: 100%; padding: 10px 11px; }
  .login-btn { width: 100%; margin-top: 8px; padding: 10px; background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; font-size: 13.5px; }
  .login-btn:hover { background: #23578a; }
  .login-error { color: var(--red); font-size: 12px; margin-top: 10px; text-align: center; }
  .login-hint { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border-strong); font-size: 11px; color: var(--text-faint); line-height: 1.6; }

  /* ---- layout / panel (shared) ---- */
  .layout { display: grid; grid-template-columns: 230px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel-head { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .07em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }

  .emp-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
  .emp-row:hover { background: var(--panel-2); }
  .emp-row.active { background: var(--blue-soft); border-color: var(--blue); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .emp-info { flex: 1; min-width: 0; }
  .emp-name { font-size: 13px; font-weight: 500; }
  .emp-role { font-size: 11px; color: var(--text-faint); }
  .emp-code { font-size: 10.5px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; }
  .emp-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; }

  .small-btn { width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-size: 12px; }
  .reset-link { width: 100%; margin-top: 6px; text-align: center; font-size: 11px; color: var(--text-faint); background: none; border: none; text-decoration: underline; padding: 4px; }

  .form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-strong); display: flex; flex-direction: column; gap: 8px; }
  .form-actions { display: flex; gap: 8px; }
  .form-actions button { flex: 1; padding: 7px; font-size: 12px; }
  .btn-primary { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; }
  .btn-primary:hover { background: #23578a !important; }
  .form-error { color: var(--red); font-size: 11.5px; }

  /* ---- toolbar / tabs ---- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar-actions { display: flex; gap: 8px; }
  .add-task-btn, .export-btn, .back-btn { display: flex; align-items: center; gap: 6px; padding: 9px 14px; font-size: 13px; font-weight: 500; }
  .add-task-btn { background: var(--blue); border-color: var(--blue); color: #fff; }
  .add-task-btn:hover { background: #23578a; }
  .export-btn { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .back-btn { background: var(--panel-2); }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-soft); border: 1px solid var(--blue); color: var(--blue); border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer; }

  .view-tabs { display: flex; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
  .view-tab { display: flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 12.5px; font-weight: 500; color: var(--text-dim); border: none; background: transparent; border-radius: 6px; }
  .view-tab:hover { background: var(--panel); border: none; }
  .view-tab.active { background: var(--blue); color: #fff; }
  .view-tab.active:hover { background: var(--blue); }

  /* ---- dashboard ---- */
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .dash-card-head { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
  .donut-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 150px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .legend-item .dot { width: 9px; height: 9px; flex-shrink: 0; }
  .legend-item .legend-label { flex: 1; color: var(--text-dim); }
  .legend-item .legend-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  .emp-bar-row { margin-bottom: 13px; }
  .emp-bar-row:last-child { margin-bottom: 0; }
  .emp-bar-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; gap: 8px; }
  .emp-bar-name { display: flex; align-items: center; gap: 6px; font-weight: 500; min-width: 0; }
  .emp-bar-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emp-bar-count { font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); font-size: 11px; white-space: nowrap; }
  .bar-track { height: 9px; background: var(--panel-2); border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
  .bar-fill { height: 100%; position: relative; border-radius: 6px; }
  .bar-fill-done { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 6px; }

  .alert-list, .recent-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .alert-item, .recent-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; font-size: 12.5px; cursor: pointer; }
  .alert-item { background: var(--red-soft); }
  .alert-item svg { color: var(--red); flex-shrink: 0; }
  .recent-item { background: var(--green-soft); }
  .recent-item svg { color: var(--green); flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .item-date { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; white-space: nowrap; }
  .empty-dash { color: var(--text-faint); font-size: 12.5px; padding: 10px 2px; }

  /* ---- department cards (overview) ---- */
  /* ---- thanh tổng hợp số liệu lớn, nằm trong khu vực dashboard (thay cho 4 ô nhỏ trước đây ở header) ---- */
  .dash-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .dash-summary-item { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .dash-summary-label { font-size: 11.5px; letter-spacing: .07em; color: var(--text-faint); text-transform: uppercase; }
  .dash-summary-value { font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 700; margin-top: 4px; line-height: 1.1; } /* FONT: số liệu tổng hợp lớn trong dashboard Tổng quan */
  .dash-summary-value.warn { color: var(--red); }

  .dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-top: 4px; }
  .dept-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 16px; }
  .dept-card:hover { border-color: var(--blue); box-shadow: 0 4px 14px rgba(43,108,163,.08); }
  .dept-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dept-badge { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 15px; flex-shrink: 0; } /* FONT: chữ viết tắt trong huy hiệu bộ phận */
  .dept-name { font-weight: 600; font-size: 17px; }
  .dept-sub { font-size: 12.5px; color: var(--text-faint); }
  .dept-stats-row { display: flex; gap: 18px; }
  .dept-stat { font-size: 12.5px; color: var(--text-dim); }
  .dept-stat b { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 19px; color: var(--text); } /* FONT: số liệu trong từng thẻ dashboard bộ phận */
  .dept-progress { height: 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); overflow: hidden; }
  .dept-progress-fill { height: 100%; }
  .section-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin: 26px 0 12px; display: flex; align-items: center; gap: 7px; }

  /* ---- task form ---- */
  .task-form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .task-form-row { display: grid; grid-template-columns: 2fr 1.2fr 1fr; gap: 8px; }
  .task-form-row2 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; align-items: end; }
  .task-form-row3 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; align-items: end; }
  @media (max-width: 760px) { .task-form-row, .task-form-row2, .task-form-row3 { grid-template-columns: 1fr 1fr; } }
  .field-label { font-size: 10px; color: var(--text-faint); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: .05em; }
  .task-form textarea { width: 100%; resize: vertical; min-height: 36px; }

  /* ---- table ---- */
  .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  table.tasks { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  table.tasks th {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-dim); text-align: left; padding: 10px 14px 10px 12px; border-bottom: 2px solid var(--border-strong);
    background: var(--panel-2); white-space: nowrap; position: sticky; top: 0; position: relative;
    overflow: hidden; text-overflow: ellipsis;
  }
  table.tasks td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-word; overflow: hidden; }
  table.tasks tbody tr:nth-child(odd) { background: var(--panel-3); }
  table.tasks tbody tr:hover { background: var(--blue-soft); }
  .col-title { font-weight: 500; }
  .task-title-btn { background: none; border: none; padding: 0; text-align: left; font-weight: 500; color: var(--text); text-decoration: underline dotted; text-underline-offset: 3px; }
  .task-title-btn:hover { color: var(--blue); background: none; }
  .col-assignee { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-date { white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .col-date.overdue { color: var(--red); font-weight: 600; }

  .col-resizer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3;
  }
  .col-resizer:hover, .col-resizer.active { background: var(--blue); opacity: .5; }
  .row-resizer {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; cursor: row-resize; color: var(--text-faint); border-radius: 4px; flex-shrink: 0;
  }
  .row-resizer:hover { background: var(--panel-2); color: var(--blue); }
  .actions-cell { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .03em; padding: 2px 7px; border-radius: 4px; border: 1px solid; text-transform: uppercase; white-space: nowrap; display: inline-block; }
  .assignee-cell { display: flex; align-items: center; gap: 6px; }
  select.status-select { font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 7px; border-radius: 5px; font-weight: 600; }
  .icon-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .icon-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
  .empty-table { padding: 30px; text-align: center; color: var(--text-faint); font-size: 13px; }
  input.date-edit, textarea.notes-edit {
    border: 1px solid transparent; background: transparent; padding: 4px 6px; font-size: 12px; width: 100%;
    border-radius: 4px; color: var(--text); font-family: inherit;
  }
  input.date-edit { font-family: 'IBM Plex Mono', monospace; min-width: 108px; }
  input.date-edit.overdue { color: var(--red); font-weight: 600; }
  textarea.notes-edit {
    resize: both; overflow: auto; min-width: 140px; min-height: 30px; max-width: 480px;
    line-height: 1.4; white-space: pre-wrap;
  }
  input.date-edit:hover, textarea.notes-edit:hover { border-color: var(--border-strong); background: var(--panel-2); }
  input.date-edit:focus, textarea.notes-edit:focus { border-color: var(--blue); background: var(--panel); outline: none; }
  .col-notes { min-width: 160px; color: var(--text-dim); max-width: 320px; }

  /* ---- modal ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(28,37,48,.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--panel); border-radius: 12px; border: 1px solid var(--border); padding: 22px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-close { width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .modal-grid.full { grid-template-columns: 1fr; }
  @media (max-width: 520px) { .modal-grid { grid-template-columns: 1fr; } }
  .modal-field input, .modal-field select, .modal-field textarea { width: 100%; }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .modal-actions-right { display: flex; gap: 8px; }

  /* ---- machines ---- */
  .machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .machine-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .machine-card.completed { opacity: .75; background: var(--panel-2); }
  .machine-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .machine-name { font-weight: 600; font-size: 14.5px; }
  .machine-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .machine-spec { font-size: 12px; color: var(--text-dim); background: var(--panel-2); border-radius: 7px; padding: 8px 10px; max-height: 70px; overflow-y: auto; white-space: pre-wrap; }
  .machine-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .machine-group { background: var(--panel-2); border-radius: 8px; padding: 8px 9px; }

function startColResize(e, idx) {
  e.preventDefault();
  const table = document.querySelector("table.tasks");
  const startX = e.clientX;
  const startWidth = colWidths[idx];
  const col = table.querySelectorAll("colgroup col")[idx];
  document.body.style.userSelect = "none";
  function onMove(ev) {
    const w = Math.max(50, startWidth + (ev.clientX - startX));
    col.style.width = w + "px";
  }
  function onUp(ev) {
    const w = Math.max(50, startWidth + (ev.clientX - startX));
    colWidths[idx] = w;
    document.body.style.userSelect = "";
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}
function startRowResize(e, grip) {
  e.preventDefault();
  e.stopPropagation();
  const tr = grip.closest("tr");
  const taskId = tr.getAttribute("data-task-id");
  const startY = e.clientY;
  const startHeight = tr.offsetHeight;
  document.body.style.userSelect = "none";
  function onMove(ev) {
    const h = Math.max(30, startHeight + (ev.clientY - startY));
    tr.style.height = h + "px";
  }
  function onUp(ev) {
    const h = Math.max(30, startHeight + (ev.clientY - startY));
    if (taskId) rowHeights[taskId] = h;
    document.body.style.userSelect = "";
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }

  document.addEventListener("mouseup", onUp);

/* ===================== HELPERS ===================== */
function uid(prefix) { return prefix + Math.random().toString(36).slice(2, 9); }
function pad2(n) { return String(n).padStart(2, "0"); }
function taskDueDate(t) { return t.deadline || t.endDate; }
function isOverdue(t) {
  const due = taskDueDate(t);
  if (!due || t.status === "done") return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return new Date(due + "T00:00:00") < today;
}
function fmtDate(d) {
  if (!d) return "—";
  return new Date(d + "T00:00:00").toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function fmtTime(d) {
  if (!d) return "";
  return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function departmentById(id) { return departments.find((d) => d.id === id); }
function employeeById(id) { return employees.find((e) => e.id === id); }
function machineById(id) { return machines.find((m) => m.id === id); }
function statusInfo(key) { return STATUS_OPTS.find((s) => s.key === key) || STATUS_OPTS[0]; }
function priorityInfo(key) { return PRIORITY[key] || PRIORITY.medium; }
function deptEmployees(deptId) { return employees.filter((e) => e.departmentId === deptId); }
function deptTasks(deptId) { return tasks.filter((t) => t.departmentId === deptId); }
function deptMachines(deptId) { return machines.filter((m) => m.departmentId === deptId); }
function deptLeaves(deptId) { return leaveRequests.filter((l) => l.departmentId === deptId); }
function taskCountFor(empId) { return tasks.filter((t) => t.assigneeId === empId).length; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ===================== STORAGE (Firebase Firestore) ===================== */
function initStorage() {
  if (!IS_CONFIGURED) {
    departments = seedDepartments.slice();
    employees = seedEmployees.slice();
    tasks = seedTasks.slice();
    leaveRequests = seedLeaves.slice();
    machines = seedMachines.slice();
    loaded = true;
    render();
    return;
  }
  const docRef = db.collection("tcc").doc("data");
  docRef.onSnapshot(
    (snap) => {
      if (snap.exists) {
        const data = snap.data();
        departments = data.departments || seedDepartments.slice();
        employees = data.employees || [];
        tasks = data.tasks || [];
        leaveRequests = data.leaveRequests || [];
        machines = data.machines || [];
      } else {
        departments = seedDepartments.slice();
        employees = seedEmployees.slice();
        tasks = seedTasks.slice();
        leaveRequests = seedLeaves.slice();
        machines = seedMachines.slice();
        docRef.set({ departments, employees, tasks, leaveRequests, machines }).catch(() => {});
      }
      loaded = true; syncing = false; syncError = ""; lastSync = new Date();
      render();
    },
    (err) => {
      syncError = err.code === "permission-denied"
        ? "Không có quyền truy cập Firestore - kiểm tra lại Security Rules."
        : "Mất kết nối tới Firestore.";
      loaded = true; syncing = false; render();
    }
  );
}
async function saveData() {
  if (!IS_CONFIGURED) return;
  syncing = true; syncError = "";
  renderSyncBar();
  try {
    await db.collection("tcc").doc("data").set({ departments, employees, tasks, leaveRequests, machines });
    lastSync = new Date();
  } catch (e) {
    syncError = e.code === "permission-denied"
      ? "Không có quyền ghi dữ liệu - kiểm tra lại Security Rules."
      : "Lưu dữ liệu thất bại, vui lòng thử lại.";
  }
  syncing = false;
  renderSyncBar();
}

/* ===================== AUTH ===================== */
function doLogin() {
  const code = (document.getElementById("f-login-code").value || "").trim();
  const pass = (document.getElementById("f-login-pass").value || "").trim();
  if (!code || !pass) { loginError = "Vui lòng nhập đầy đủ Mã nhân viên và Mật khẩu."; render(); return; }
  const emp = employees.find((e) => e.code.toLowerCase() === code.toLowerCase());
  if (!emp || (emp.password || "") !== pass) {
    loginError = "Sai mã nhân viên hoặc mật khẩu.";
    render();
    return;
  }
  currentUser = emp;
  loginError = "";
  view = "overview";
  render();
}
function loginKeydown(e) { if (e.key === "Enter") doLogin(); }
function logout() {
  currentUser = null;
  view = "login";
  activeDeptId = null;
  render();
}

  const de = deptEmployees(id);

}
function backToOverview() { view = "overview"; activeDeptId = null; render(); }

/* ===================== DEPARTMENT ACTIONS ===================== */
async function addDepartment() {
  const name = document.getElementById("f-dname").value.trim();
  const errEl = document.getElementById("f-dept-error");
  if (!name) { if (errEl) errEl.textContent = "Vui lòng nhập tên bộ phận."; return; }
  const color = PALETTE[departments.length % PALETTE.length];
  departments.push({ id: uid("d"), name, color });
  showDeptForm = false;
  render();
  await saveData();
}

/* ===================== EMPLOYEE ACTIONS ===================== */
async function addEmployee() {
  const code = document.getElementById("f-ecode").value.trim();
  const name = document.getElementById("f-ename").value.trim();
  const role = document.getElementById("f-erole").value.trim();
  const pass = document.getElementById("f-epass").value.trim();
  const errEl = document.getElementById("f-emp-error");
  if (!code || !name) { if (errEl) errEl.textContent = "Vui lòng nhập mã số và tên nhân viên."; return; }
  if (employees.some((e) => e.code.toLowerCase() === code.toLowerCase())) {
    if (errEl) errEl.textContent = "Mã nhân viên đã tồn tại.";
    return;
  }
  const color = PALETTE[employees.length % PALETTE.length];
  employees.push({ id: uid("e"), code, name, role: role || "Nhân viên", password: pass || code, departmentId: activeDeptId, color });
  showEmpForm = false;
  render();
  await saveData();
}
async function deleteEmployee(id) {
  if (!confirm("Xoá nhân viên này? Các công việc đã giao sẽ chuyển về trạng thái Chưa gán.")) return;
  employees = employees.filter((e) => e.id !== id);
  if (calEmpId === id) { const de = deptEmployees(activeDeptId); calEmpId = de.length ? de[0].id : null; }
  render();

/* ===================== CALENDAR (Lịch đi làm) ===================== */
function setCalEmp(id) { calEmpId = id; render(); }
function calPrevMonth() { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); render(); }
function calNextMonth() { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); render(); }
function dateOnLeave(empId, dateStr) {
  return leaveRequests.some((l) => l.employeeId === empId && l.status !== "rejected" && l.fromDate && l.toDate && dateStr >= l.fromDate && dateStr <= l.toDate);
}
function buildCalendar(empId, monthDate) {
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // T2 = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);
  const dows = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
  let cells = dows.map((d) => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < firstDow; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${pad2(month + 1)}-${pad2(day)}`;
    const dow = (new Date(year, month, day).getDay() + 6) % 7;
    const weekend = dow >= 5;
    const onLeave = empId ? dateOnLeave(empId, dateStr) : false;
    const cls = ["cal-cell"];
    if (weekend) cls.push("weekend");
    if (onLeave) cls.push("leave");
    if (dateStr === todayStr) cls.push("today");
    cells += `<div class="${cls.join(" ")}" title="${onLeave ? "Nghỉ phép" : weekend ? "Cuối tuần" : "Đi làm"}">${day}</div>`;
  }
  return `<div class="cal-grid">${cells}</div>`;
}

/* ===================== DONUT ===================== */
function buildDonut(segments, opts) {
  opts = opts || {};
  const size = opts.size || 148;
  const thickness = opts.thickness || 20;
  const centerLabel = opts.centerLabel || "";
  const centerSub = opts.centerSub || "";
  const total = segments.reduce((a, s) => a + s.value, 0);
  const radius = (size - thickness) / 2;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  let circles = "";
  if (total <= 0) {
    circles = `<circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="var(--border)" stroke-width="${thickness}"/>`;
  } else {
    segments.forEach((seg) => {
      if (seg.value <= 0) return;
      const frac = seg.value / total;
      const dash = frac * circumference;
      circles += `<circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="var(--${seg.color})" stroke-width="${thickness}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
      offset += dash;
    });
  }
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
      ${circles}
      <text x="50%" y="46%" text-anchor="middle" class="mono" style="font-size:22px;font-weight:700;fill:var(--text)">${escapeHtml(centerLabel)}</text>
      <text x="50%" y="63%" text-anchor="middle" style="font-size:9.5px;fill:var(--text-faint)">${escapeHtml(centerSub)}</text>
    </svg>
  `;
}

/* ===================== SHARED DASHBOARD BLOCK ===================== */
function renderDashboardBlock(tasksForDash, empList) {
  const total = tasksForDash.length;
  const todoCount = tasksForDash.filter((t) => t.status === "todo").length;
  const pendingCount = tasksForDash.filter((t) => t.status === "pending").length;
  const doingCount = tasksForDash.filter((t) => t.status === "doing").length;
  const doneCount = tasksForDash.filter((t) => t.status === "done").length;
  const overdueCount = tasksForDash.filter((t) => isOverdue(t)).length;
  const completionRate = total ? Math.round((doneCount / total) * 100) : 0;

  const statusDonut = buildDonut(
    [
      { value: todoCount, color: "border-strong" },
      { value: pendingCount, color: "amber" },
      { value: doingCount, color: "teal" },
      { value: doneCount, color: "green" },
    ],
    { centerLabel: completionRate + "%", centerSub: "hoàn thành" }
  );

  const empCounts = empList.map((e) => tasksForDash.filter((t) => t.assigneeId === e.id).length);
  const maxEmpCount = Math.max(1, ...empCounts, 0);
  const empBars = empList.length
    ? empList.map((e) => {
        const empTasks = tasksForDash.filter((t) => t.assigneeId === e.id);
        const cnt = empTasks.length;
        const done = empTasks.filter((t) => t.status === "done").length;
        const pct = maxEmpCount ? (cnt / maxEmpCount) * 100 : 0;
        const donePct = cnt ? (done / cnt) * 100 : 0;
        return `
          <div class="emp-bar-row">
            <div class="emp-bar-top">
              <span class="emp-bar-name"><span class="dot" style="background:var(--${e.color})"></span><span>${escapeHtml(e.name)}</span></span>
              <span class="emp-bar-count">${done}/${cnt} hoàn thành</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%;background:var(--${e.color}-soft)">
                <div class="bar-fill-done" style="width:${donePct}%;background:var(--${e.color})"></div>
              </div>
            </div>
          </div>
        `;
      }).join("")
    : `<div class="empty-dash">Chưa có nhân sự nào.</div>`;

  const overdueTasks = tasksForDash.filter((t) => isOverdue(t)).slice().sort((a, b) => (taskDueDate(a) || "").localeCompare(taskDueDate(b) || ""));
  const overdueHtml = overdueTasks.length
    ? overdueTasks.slice(0, 8).map((t) => {
        const emp = employeeById(t.assigneeId);
        return `
          <div class="alert-item" onclick="jumpToTask('${t.id}')">
            ${ic("alert")}
            <div class="item-info">
              <div class="item-title">${escapeHtml(t.title)}</div>
              <div class="item-sub">${emp ? escapeHtml(emp.name) : "Chưa gán"}</div>
            </div>
            <div class="item-date" style="color:var(--red)">${fmtDate(taskDueDate(t))}</div>
          </div>
        `;
      }).join("")
    : `<div class="empty-dash">Không có công việc quá hạn 🎉</div>`;

  const recentDone = tasksForDash.filter((t) => t.status === "done").slice()
    .sort((a, b) => (b.endDate || "").localeCompare(a.endDate || ""));
  const recentHtml = recentDone.length
    ? recentDone.slice(0, 8).map((t) => {
        const emp = employeeById(t.assigneeId);
        return `
          <div class="recent-item" onclick="jumpToTask('${t.id}')">
            ${ic("check")}
            <div class="item-info">
              <div class="item-title">${escapeHtml(t.title)}</div>
              <div class="item-sub">${emp ? escapeHtml(emp.name) : "Chưa gán"}</div>
            </div>
            <div class="item-date" style="color:var(--green)">${fmtDate(t.endDate)}</div>
          </div>
        `;
      }).join("")
    : `<div class="empty-dash">Chưa có công việc nào hoàn thành.</div>`;

  return `
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-card-head">${ic("grid")} Trạng thái công việc</div>
        <div class="donut-row">
          ${statusDonut}
          <div class="donut-legend">
            <div class="legend-item"><span class="dot" style="background:var(--border-strong)"></span><span class="legend-label">Chưa làm</span><span class="legend-value mono">${todoCount}</span></div>
            <div class="legend-item"><span class="dot" style="background:var(--amber)"></span><span class="legend-label">Đang chờ</span><span class="legend-value mono">${pendingCount}</span></div>
            <div class="legend-item"><span class="dot" style="background:var(--teal)"></span><span class="legend-label">Đang làm</span><span class="legend-value mono">${doingCount}</span></div>
            <div class="legend-item"><span class="dot" style="background:var(--green)"></span><span class="legend-label">Hoàn thành</span><span class="legend-value mono">${doneCount}</span></div>
            <div class="legend-item"><span class="dot" style="background:var(--red)"></span><span class="legend-label">Quá hạn</span><span class="legend-value mono">${overdueCount}</span></div>
          </div>
        </div>
      </div>
      <div class="dash-card">
        <div class="dash-card-head">${ic("users")} Công việc theo nhân viên</div>
        ${empBars}
      </div>
      <div class="dash-card">
        <div class="dash-card-head">${ic("alert")} Cần chú ý (quá hạn)</div>
        <div class="alert-list">${overdueHtml}</div>
      </div>

        <div class="recent-list">${recentHtml}</div>
      </div>
    </div>
  `;
}

        <button class="view-tab ${deptTab === "machines" ? "active" : ""}" onclick="setDeptTab('machines')">${ic("wrench")} Máy đang chạy</button>
      </div>
      <div class="toolbar-actions"><button class="export-btn" onclick="exportExcel()">${ic("download")} Xuất Excel</button></div>
    </div>
    ${body}
  `;
}

/* ---- Tab: Nhân viên (nhân viên / đơn nghỉ / lịch đi làm) ---- */
function renderDeptEmployeesTab(dept) {
  const emps = deptEmployees(dept.id);
  const leaves = deptLeaves(dept.id).slice().sort((a, b) => (b.fromDate || "").localeCompare(a.fromDate || ""));

  const empRows = emps.length ? emps.map((e) => `
    <div class="emp-row">
      <span class="dot" style="background:var(--${e.color})"></span>
      <div class="emp-info">
        <div class="emp-name">${escapeHtml(e.name)} <span class="emp-code">· ${escapeHtml(e.code)}</span></div>
        <div class="emp-role">${escapeHtml(e.role)}</div>
      </div>
      <span class="emp-count mono">${taskCountFor(e.id)}</span>
      <button class="icon-btn danger" style="margin-left:4px" onclick="deleteEmployee('${e.id}')" aria-label="Xoá nhân viên">${ic("trash")}</button>
    </div>
  `).join("") : `<div class="empty-table" style="padding:16px">Chưa có nhân viên nào trong bộ phận này.</div>`;

  const leaveEmpOptions = emps.map((e) => `<option value="${e.id}">${escapeHtml(e.name)} (${escapeHtml(e.code)})</option>`).join("");
  const leaveList = leaves.length ? leaves.map((l) => {
    const emp = employeeById(l.employeeId);
    const stColor = l.status === "approved" ? "green" : l.status === "rejected" ? "red" : "amber";
    return `
      <div class="leave-item">
        <div class="item-info">
          <div class="item-title">${emp ? escapeHtml(emp.name) : "Đã xoá"} <span class="item-sub">(${fmtDate(l.fromDate)} → ${fmtDate(l.toDate)})</span></div>
          ${l.reason ? `<div class="item-sub">${escapeHtml(l.reason)}</div>` : ""}
        </div>
        <div class="leave-actions">
          <select class="status-select" style="color:var(--${stColor});border-color:var(--${stColor})" onchange="setLeaveStatus('${l.id}',this.value)">
            <option value="pending" ${l.status === "pending" ? "selected" : ""}>Chờ duyệt</option>
            <option value="approved" ${l.status === "approved" ? "selected" : ""}>Đã duyệt</option>
            <option value="rejected" ${l.status === "rejected" ? "selected" : ""}>Từ chối</option>
          </select>
          <button class="icon-btn danger" onclick="deleteLeave('${l.id}')">${ic("trash")}</button>
        </div>
      </div>
    `;
  }).join("") : `<div class="empty-dash">Chưa có đơn nghỉ nào.</div>`;

  const calEmpOptions = emps.map((e) => `<option value="${e.id}" ${calEmpId === e.id ? "selected" : ""}>${escapeHtml(e.name)}</option>`).join("");
  const monthLabel = calMonth.toLocaleDateString("vi-VN", { month: "long", year: "numeric" });

  return `
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-card-head">${ic("users")} Quản lý nhân viên</div>
        ${empRows}
        ${!showEmpForm
          ? `<button class="small-btn" onclick="showEmpForm=true;render()">${ic("plus")} Thêm nhân viên</button>`
          : `<div class="form">
               <input id="f-ecode" placeholder="Mã số nhân viên (VD: NV005)" />
               <input id="f-ename" placeholder="Họ tên" />
               <input id="f-erole" placeholder="Chức vụ" />
               <input id="f-epass" placeholder="Mật khẩu đăng nhập (để trống = dùng mã NV)" />
               <div id="f-emp-error" class="form-error"></div>
               <div class="form-actions">
                 <button class="btn-primary" onclick="addEmployee()">Thêm</button>
                 <button onclick="showEmpForm=false;render()">Huỷ</button>
               </div>
             </div>`}
      </div>

      <div class="dash-card">
        <div class="dash-card-head">${ic("calendar")} Tạo đơn nghỉ</div>
        ${!showLeaveForm
          ? `<button class="small-btn" onclick="showLeaveForm=true;render()">${ic("plus")} Tạo đơn nghỉ mới</button>`
          : `<div class="form" style="margin-top:0;border-top:none;padding-top:0">
               <select id="f-lemp"><option value="">Chọn nhân viên...</option>${leaveEmpOptions}</select>
               <div style="display:flex;gap:8px">
                 <input id="f-lfrom" type="date" style="flex:1" />
                 <input id="f-lto" type="date" style="flex:1" />
               </div>
               <input id="f-lreason" placeholder="Lý do nghỉ (không bắt buộc)" />
               <div id="f-leave-error" class="form-error"></div>
               <div class="form-actions">
                 <button class="btn-primary" onclick="addLeave()">Tạo đơn</button>
                 <button onclick="showLeaveForm=false;render()">Huỷ</button>
               </div>
             </div>`}
        <div class="leave-list" style="margin-top:12px">${leaveList}</div>
      </div>

      <div class="dash-card" style="grid-column:1 / -1">
        <div class="dash-card-head">${ic("calendar")} Lịch đi làm của nhân viên</div>
        ${emps.length ? `
          <div class="cal-head">
            <select onchange="setCalEmp(this.value)" style="min-width:180px">${calEmpOptions}</select>
            <div style="display:flex;align-items:center;gap:8px">
              <button class="cal-nav-btn" onclick="calPrevMonth()">‹</button>
              <span class="cal-month-label">${escapeHtml(monthLabel)}</span>
              <button class="cal-nav-btn" onclick="calNextMonth()">›</button>
            </div>
          </div>
          ${buildCalendar(calEmpId, calMonth)}
          <div class="cal-legend">
            <span><span class="sw" style="background:var(--panel-2);border:1px solid var(--border)"></span>Đi làm</span>
            <span><span class="sw" style="background:var(--amber-soft);border:1px solid var(--amber)"></span>Nghỉ phép</span>
            <span><span class="sw" style="background:var(--panel-2)"></span>Cuối tuần (chữ mờ)</span>
          </div>
        ` : `<div class="empty-dash">Chưa có nhân viên để hiển thị lịch.</div>`}
      </div>
    </div>
  `;
}

/* ---- Tab: Task công việc ---- */
function renderDeptTasksTab(dept) {
  const emps = deptEmployees(dept.id);
  const allDeptTasks = deptTasks(dept.id);
  const visibleTasks = filterId ? allDeptTasks.filter((t) => t.assigneeId === filterId) : allDeptTasks;
  const filterEmp = filterId ? employeeById(filterId) : null;
  const machineOptions = deptMachines(dept.id).map((m) => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join("");

  return `
    <div class="layout">
      <div class="panel">
        <div class="panel-head">${ic("users")} Lọc theo nhân viên</div>
        ${emps.length === 0 ? `<div class="empty-table">Chưa có nhân sự nào.</div>` : ""}
        ${emps.map((emp) => `
          <div class="emp-row ${filterId === emp.id ? "active" : ""}" onclick="toggleFilter('${emp.id}')">
            <span class="dot" style="background:var(--${emp.color})"></span>
            <div class="emp-info"><div class="emp-name">${escapeHtml(emp.name)}</div><div class="emp-role">${escapeHtml(emp.role)}</div></div>
            <span class="emp-count mono">${taskCountFor(emp.id)}</span>
          </div>
        `).join("")}
      </div>

      <div>
        <div class="toolbar">
          <div class="toolbar-left">
            ${filterEmp ? `<span class="filter-chip" onclick="toggleFilter('${filterEmp.id}')">Đang lọc: ${escapeHtml(filterEmp.name)} ${ic("x")}</span>` : `<span style="font-size:12.5px;color:var(--text-faint)">Nhấn tên công việc để xem chi tiết</span>`}
          </div>
          <div class="toolbar-actions">
            <button class="add-task-btn" onclick="showTaskForm=!showTaskForm;render()">${ic("plus")} Thêm công việc</button>
          </div>
        </div>

        ${showTaskForm ? `
          <div class="task-form">
            <div class="task-form-row">
              <div><label class="field-label">Tên công việc</label><input id="f-title" placeholder="VD: Hiệu chỉnh cảm biến trạm AL" style="width:100%" /></div>
              <div><label class="field-label">Người phụ trách</label>
                <select id="f-assignee" style="width:100%"><option value="">Chọn...</option>
                  ${emps.map((e) => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join("")}
                </select>
              </div>
              <div><label class="field-label">Độ ưu tiên</label>
                <select id="f-priority" style="width:100%">
                  <option value="high">Cao</option><option value="medium" selected>Trung bình</option><option value="low">Thấp</option>
                </select>
              </div>
            </div>
            <div class="task-form-row3">
              <div><label class="field-label">Gắn với máy</label>
                <select id="f-machine" style="width:100%"><option value="">— Không gắn máy —</option>${machineOptions}</select>
              </div>
              <div><label class="field-label">Ghi chú</label><textarea id="f-notes" placeholder="Ghi chú thêm (không bắt buộc)"></textarea></div>
            </div>
            <div class="task-form-row2">
              <div><label class="field-label">Ngày Start</label><input id="f-start" type="date" style="width:100%" /></div>
              <div><label class="field-label">Ngày End</label><input id="f-end" type="date" style="width:100%" /></div>
              <div><label class="field-label">Deadline</label><input id="f-deadline" type="date" style="width:100%" /></div>
              <div></div>
            </div>
            <div class="form-actions" style="max-width:260px">
              <button class="btn-primary" onclick="addTask()">Tạo công việc</button>
              <button onclick="showTaskForm=false;render()">Huỷ</button>
            </div>
            <div id="f-error" class="form-error"></div>
          </div>
        ` : ""}

        <div class="table-wrap">
          <table class="tasks">
            <colgroup>${colWidths.map((w) => `<col style="width:${w}px">`).join("")}</colgroup>
            <thead>
              <tr>
                ${COL_LABELS.map((label, i) => `
                  <th>${escapeHtml(label)}${i < COL_LABELS.length - 1 ? `<span class="col-resizer" onmousedown="startColResize(event,${i})"></span>` : ""}</th>
                `).join("")}
              </tr>
            </thead>
            <tbody>
              ${visibleTasks.length === 0 ? `<tr><td colspan="9" class="empty-table">Không có công việc nào.</td></tr>` : ""}
              ${visibleTasks.map((task) => {
                const emp = employeeById(task.assigneeId);
                const overdue = isOverdue(task);
                const prio = priorityInfo(task.priority);
                const st = statusInfo(task.status);
                return `
                  <tr data-task-id="${task.id}" style="${rowHeights[task.id] ? "height:" + rowHeights[task.id] + "px" : ""}">
                    <td class="col-title"><button class="task-title-btn" onclick="openTaskModal('${task.id}')">${escapeHtml(task.title)}</button></td>
                    <td class="col-assignee"><span class="assignee-cell">${emp ? `<span class="dot" style="background:var(--${emp.color})"></span>${escapeHtml(emp.name)}` : "Chưa gán"}</span></td>
                    <td><span class="badge mono" style="color:var(--${prio.color});border-color:var(--${prio.color})">${prio.label}</span></td>
                    <td>
                      <select class="status-select" style="color:var(--${st.color});border-color:var(--${st.color})" onchange="setStatus('${task.id}',this.value)">
                        ${STATUS_OPTS.map((s) => `<option value="${s.key}" ${s.key === task.status ? "selected" : ""}>${s.label}</option>`).join("")}
                      </select>
                    </td>
                    <td class="col-date"><input type="date" class="date-edit" value="${task.startDate || ""}" onchange="updateField('${task.id}','startDate',this.value)" /></td>
                    <td class="col-date"><input type="date" class="date-edit" value="${task.endDate || ""}" onchange="updateField('${task.id}','endDate',this.value)" /></td>
                    <td class="col-date ${overdue ? "overdue" : ""}"><input type="date" class="date-edit ${overdue ? "overdue" : ""}" value="${task.deadline || ""}" onchange="updateField('${task.id}','deadline',this.value)" />${overdue ? " ⚠" : ""}</td>
                    <td class="col-notes"><textarea class="notes-edit" rows="1" placeholder="Ghi chú..." title="${escapeAttr(task.notes || "")}" onchange="updateField('${task.id}','notes',this.value)">${escapeHtml(task.notes || "")}</textarea></td>
                    <td><div class="actions-cell">
                      <span class="row-resizer" title="Kéo để chỉnh chiều cao hàng" onmousedown="startRowResize(event,this)">${ic("grip")}</span>
                      <button class="icon-btn danger" onclick="deleteTask('${task.id}')" aria-label="Xoá công việc">${ic("trash")}</button>
                    </div></td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

/* ---- Tab: Máy đang chạy ---- */
function machineTaskGroup(title, list) {
  return `
    <div class="machine-group">
      <div class="machine-group-head"><span>${title}</span><span class="mono">${list.length}</span></div>
      ${list.length ? list.slice(0, 6).map((t) => `<div class="machine-task-item" onclick="openTaskModal('${t.id}')">${escapeHtml(t.title)}</div>`).join("") : `<div class="machine-empty">— trống —</div>`}
    </div>
  `;
}
function renderMachineCard(m, dept) {
  const mTasks = tasks.filter((t) => t.machineId === m.id);
  const doing = mTasks.filter((t) => t.status === "doing");
  const pending = mTasks.filter((t) => t.status === "pending");
  const done = mTasks.filter((t) => t.status === "done");
  const todo = mTasks.filter((t) => t.status === "todo");
  const highPrio = mTasks.filter((t) => t.priority === "high" && t.status !== "done");
  return `
    <div class="machine-card ${m.completed ? "completed" : ""}">
      <div class="machine-head">
        <div>
          <div class="machine-name">${escapeHtml(m.name)}</div>
          <div class="machine-meta">${ic("calendar")} Ngày giao hàng: ${fmtDate(m.deliveryDate)}</div>
        </div>
        <span class="badge mono" style="color:var(--${m.completed ? "green" : "teal"});border-color:var(--${m.completed ? "green" : "teal"})">${m.completed ? "Đã xong" : "Đang chạy"}</span>
      </div>
      ${m.spec ? `<div class="machine-spec">${escapeHtml(m.spec)}</div>` : ""}
      <div class="machine-groups">
        ${machineTaskGroup("Đang làm", doing)}
        ${machineTaskGroup("Đang pending", pending)}
        ${machineTaskGroup("Chưa làm", todo)}
        ${machineTaskGroup("Đã hoàn thành", done)}
      </div>
      ${machineTaskGroup("Ưu tiên cao", highPrio)}
      <div class="machine-actions">
        <button onclick="deptTab='tasks';showTaskForm=true;render();document.getElementById('f-machine') && (document.getElementById('f-machine').value='${m.id}')">${ic("plus")} Thêm việc cho máy</button>
        <button class="${m.completed ? "" : "btn-primary"}" onclick="toggleMachineCompleted('${m.id}')">${m.completed ? "Khôi phục đang chạy" : "Đánh dấu hoàn thành"}</button>
      </div>
    </div>
  `;
}
function renderDeptMachinesTab(dept) {
  const all = deptMachines(dept.id);
  const active = all.filter((m) => !m.completed);
  const completed = all.filter((m) => m.completed);
  return `
    <div class="toolbar">
      <div class="toolbar-left"><span style="font-size:12.5px;color:var(--text-faint)">${active.length} máy đang chạy · ${completed.length} máy đã hoàn thành</span></div>
      <div class="toolbar-actions"><button class="add-task-btn" onclick="showMachineForm=!showMachineForm;render()">${ic("plus")} Thêm máy mới</button></div>
    </div>
    ${showMachineForm ? `
      <div class="task-form">
        <div class="task-form-row">
          <div><label class="field-label">Tên máy</label><input id="f-mname" placeholder="VD: Máy C - X198" style="width:100%" /></div>
          <div><label class="field-label">Ngày giao hàng</label><input id="f-mdate" type="date" style="width:100%" /></div>
          <div></div>
        </div>
        <div><label class="field-label">Spec</label><textarea id="f-mspec" placeholder="Thông số kỹ thuật, cấu hình..." style="width:100%"></textarea></div>
        <div class="form-actions" style="max-width:220px">
          <button class="btn-primary" onclick="addMachine()">Thêm máy</button>
          <button onclick="showMachineForm=false;render()">Huỷ</button>
        </div>
        <div id="f-machine-error" class="form-error"></div>
      </div>
    ` : ""}

    ${active.length ? `<div class="machine-grid">${active.map((m) => renderMachineCard(m, dept)).join("")}</div>` : `<div class="empty-table">Chưa có máy nào đang chạy trong bộ phận này.</div>`}

    <div class="section-title" style="cursor:pointer" onclick="toggleShowCompletedMachines()">
      ${ic("check")} Máy cũ đã hoàn thành (${completed.length}) ${showCompletedMachines ? "▲" : "▼"}
    </div>
    ${showCompletedMachines ? (completed.length ? `<div class="machine-grid">${completed.map((m) => renderMachineCard(m, dept)).join("")}</div>` : `<div class="empty-table">Chưa có máy nào hoàn thành.</div>`) : ""}
  `;
}

/* ===================== TASK DETAIL MODAL ===================== */

    <div class="modal-overlay" onclick="if(event.target===this) closeTaskModal()">
      <div class="modal">
        <div class="modal-head">
          <h3>Chi tiết công việc</h3>
          <button class="modal-close" onclick="closeTaskModal()">${ic("x")}</button>
        </div>
        <div class="modal-grid full modal-field">
          <div><label class="field-label">Tên công việc</label><input id="m-title" value="${escapeAttr(t.title)}" /></div>

          </div>
          <div class="modal-field"><label class="field-label">Độ ưu tiên</label>
            <select id="m-priority">
              <option value="high" ${t.priority === "high" ? "selected" : ""}>Cao</option>
              <option value="medium" ${t.priority === "medium" ? "selected" : ""}>Trung bình</option>

          </div>
          <div class="modal-field"><label class="field-label">Trạng thái</label>
            <select id="m-status">${STATUS_OPTS.map((s) => `<option value="${s.key}" ${s.key === t.status ? "selected" : ""}>${s.label}</option>`).join("")}</select>
          </div>
          <div class="modal-field"><label class="field-label">Ngày Start</label><input id="m-start" type="date" value="${t.startDate || ""}" /></div>
          <div class="modal-field"><label class="field-label">Ngày End</label><input id="m-end" type="date" value="${t.endDate || ""}" /></div>

        </div>
        <div class="modal-grid full modal-field">
          <div><label class="field-label">Ghi chú</label><textarea id="m-notes" rows="3">${escapeHtml(t.notes || "")}</textarea></div>
        </div>
        <div class="modal-actions">
          <button class="icon-btn danger" onclick="deleteTask('${t.id}')" aria-label="Xoá công việc">${ic("trash")}</button>
          <div class="modal-actions-right">
            <button onclick="closeTaskModal()">Huỷ</button>
            <button class="btn-primary" onclick="saveTaskModal('${t.id}')">Lưu thay đổi</button>

}

  el.innerHTML = `<span class="shared-note">${ic("users")} Dữ liệu dùng chung cho cả nhóm, đồng bộ tức thời ${syncing ? "· đang lưu..." : lastSync ? "· cập nhật lúc " + fmtTime(lastSync) : ""}${syncError ? `<span class="sync-error"> · ${syncError}</span>` : ""}</span>`;
}

function render() {
  if (!loaded) return;
  const app = document.getElementById("app");
  let html = "";
  if (!currentUser) {
    view = "login";
    html = renderLoginPage();
  } else if (view === "department" && activeDeptId) {
    html = renderDepartment();
  } else {
    view = "overview";
    html = renderOverviewPage();
  }
  if (taskModalId) html += renderTaskModal();
  app.innerHTML = html;
  renderSyncBar();
}

/* ===================== INIT ===================== */
initStorage();
</script>
</body>
</html>
